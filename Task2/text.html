<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting Page</title>
    <link href="./design.css" rel="stylesheet">
</head>
<body>
    <h1>Text Formatting Examples</h1>
         <div class="font">
         This is a <b>BOLD</b> text.
        <br>
         This is a <strong>STRONG</strong> text.
        <br>
        This is a <i>ITALIC</i> text.
        <br>
        his is <em>emphasized</em> text.
        <br>
        This is a <u> UNDERLINED </u> text.
        <br>
        his is a <small> SMALL </small> text.
        <br>
        This is a <del>DELETED </del> text.
        <br>
        This is a water formula H<sub>2</sub>O.
        <br>
        This is a mathematical expression X<sup>2</sup> + Y<sup>3</sup>.
    </div>
</body>
</html>
